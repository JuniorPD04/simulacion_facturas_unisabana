# Blueprint de Render: frontend y API Django en la misma URL, con PostgreSQL.
# Usa el boton Deploy to Render del README. Las claves se generan o se piden
# durante la creacion; no se guardan secretos en el repositorio.
databases:
  - name: papel-y-luna-db
    plan: free
    postgresMajorVersion: "18"
    databaseName: papel_y_luna
    user: papel_y_luna

services:
  - type: web
    name: papel-y-luna-backend
    runtime: python
    plan: free
    autoDeployTrigger: "off"
    # La raiz es publica y comprueba tambien la BD mediante el middleware.
    # /api/health/ exige autenticacion y no sirve como health check de Render.
    healthCheckPath: /
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && python manage.py seed && gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      # Cubre el subdominio *.onrender.com que Render asigna por defecto.
      # Si agregas un dominio propio, suma ese host (separado por comas).
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: papel-y-luna-db
          property: connectionString
      - key: DB_SSLMODE
        value: require
      - key: SESSION_TTL_HOURS
        value: "12"
      # Frontend y API comparten origen: js/config.js conserva /api/ y no
      # hace falta configurar CORS. Define las contrasenas al crear el Blueprint.
      - key: SEED_ADMIN_USER
        value: admin
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_CAJERO_USER
        value: cajero
      - key: SEED_CAJERO_PASSWORD
        sync: false
